services:
  backend:
    build: ./backend
    container_name: exam-backend
    restart: unless-stopped

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "18765"

    networks:
      - default
      - proxy

    volumes:
      - ./backend/app:/app/app
      - ./frontend:/frontend

    command: uvicorn app.main:app --host 0.0.0.0 --port 18765 --reload

networks:
  proxy:
    external: true
