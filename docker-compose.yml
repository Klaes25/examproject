services:
  backend:
    build: ./backend
    container_name: exam-backend
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "18765:18765"

    volumes:
      - ./backend/app:/app/app
      - ./frontend:/frontend

    command: uvicorn app.main:app --host 0.0.0.0 --port 18765 --reload
