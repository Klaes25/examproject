<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rover Control</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <main class="container">

        <h1>Rover Control Panel</h1>

        <section class="card" id="login-card">

            <h2>Login</h2>

            <input id="username" type="text" placeholder="Username">
            <input id="password" type="password" placeholder="Password">

            <div class="buttons">
                <button onclick="loginUser()">Login</button>
            </div>

            <p id="message"></p>

        </section>

        <section id="dashboard" class="card hidden">

            <h2>Dashboard</h2>

            <p>Connected as admin.</p>

            <hr>

            <h3>Rover Status</h3>

            <p id="rover-status">Rover: unknown</p>
            <p id="rover-device">Device: unknown</p>
            <p id="rover-last-seen">Last seen: unknown</p>

            <hr>

            <h3>Live Feed</h3>

            <img
                src="http://localhost:8090/video"
                alt="Rover live feed"
                style="width: 100%; max-width: 480px; border-radius: 8px;"
            >

            <hr>

            <p id="ws-status">WebSocket: not connected</p>

            <p>Latest server message:</p>
            <p id="last-command">None</p>

<div class="buttons">
    <button onclick="moveForward()">Forward</button>
    <button onclick="moveBackward()">Backward</button>
    <button onclick="turnLeft()">Left</button>
    <button onclick="turnRight()">Right</button>
    <button onclick="stopRover()">Stop</button>
    <button onclick="toggleAutonomous()">Autonomous</button>
</div>

<hr>

<h3>Robot Arm</h3>

<div class="buttons">
    <button onclick="moveArmForward()">Arm Forward</button>
    <button onclick="moveArmBackward()">Arm Backward</button>
    <button onclick="moveArmLeft()">Arm Left</button>
    <button onclick="moveArmRight()">Arm Right</button>
    <button onclick="toggleWrist()">Wrist</button>
</div>

        </section>

    </main>

    <script src="/static/app.js"></script>

</body>
</html>
